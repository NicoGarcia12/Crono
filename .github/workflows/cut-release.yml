# Plantilla de agentes-ia publicada en este repo por `eng sync` (reset de workflows de protección de main):
# develop -> release/<semver> -> rama default (main/master).
# GITHUB_TOKEN puede disparar workflow_dispatch: ejecutamos la validación real
# de pr-origin sobre la rama release, sin PAT ni estados verdes sintéticos.
name: Cut Release

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cut-release:
    name: cut-release
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Validar antes de crear ramas o escribir en el remoto.
      - name: Verificar rama default
        run: |
          [[ "$BASE_BRANCH" == main || "$BASE_BRANCH" == master ]] || { echo '::error::La rama default debe ser main o master.'; exit 1; }

      - name: Checkout develop
        # v4; el token se usa solo dentro de este repositorio.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar git-cliff
        # v2.90.1
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
        with:
          tool: git-cliff

      - name: Calcular la próxima versión
        id: version
        run: |
          NEXT=$(git cliff --bumped-version)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$NEXT" ] || [ "$NEXT" = "$LAST_TAG" ]; then
            echo '::notice::No hay commits releasables nuevos.'
            exit 0
          fi
          VERSION="${NEXT#v}"
          # SemVer: sin ceros iniciales numéricos; prerelease y build opcionales.
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$VERSION" =~ $SEMVER ]] || { echo '::error::git-cliff devolvió una versión SemVer inválida.'; exit 1; }
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Los outputs entran por env: nunca se interpolan como código de shell.
      - name: Preparar y pushear el release
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git checkout -b "release/$VERSION"
          if [ -f CHANGELOG.md ]; then
            git cliff --tag "$NEXT" --prepend CHANGELOG.md --unreleased
          else
            git cliff --tag "$NEXT" --output CHANGELOG.md
          fi
          if [ -f package.json ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): $NEXT"
          git push origin "release/$VERSION"

      - name: Abrir el PR de release y disparar sus checks
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          PR_URL="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "release/$VERSION" \
            --title "Release $NEXT" \
            --body "Changelog generado con git-cliff. Revisar antes de mergear: se publican el tag y el Release $NEXT.")"
          # El dispatch ejecuta el check en el SHA de release, no en el de la rama default.
          gh workflow run pr-origin-check.yml --ref "release/$VERSION" -f "pr_number=${PR_URL##*/}"
