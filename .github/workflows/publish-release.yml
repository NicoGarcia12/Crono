# Plantilla de agentes-ia publicada en este repo por `eng sync` (reset de workflows de protección de main; scripts/engram/templates/main-protection/).
#
# Qué hace (flujo con develop + release/*): cuando se mergea a `main` un PR que viene de
# `release/<versión>`, crea el tag `v<versión>`, publica el Release de GitHub con la sección
# correspondiente de CHANGELOG.md (la genera cut-release.yml) y vuelve a mergear `main` en
# `develop` para que no diverjan. No necesita secretos propios: alcanza con GITHUB_TOKEN.
name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main, master]

permissions:
  contents: write

jobs:
  publish:
    name: publish
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout main
        # v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sacar la versión del nombre de la rama
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${HEAD_REF#release/}"
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$VERSION" =~ $SEMVER ]] || { echo '::error::La rama release no contiene una versión SemVer válida.'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extraer la sección del changelog de esta versión
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk '/^## \[/{if(p) exit; p=1; print; next} p' CHANGELOG.md > /tmp/release-notes.md
          else
            echo "Release $TAG" > /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md

      - name: Crear el tag y publicar el Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md

      - name: Volver a mergear main en develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge "origin/$BASE_BRANCH" --no-edit
          git push origin develop
